[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lyra-neural-verse"
version = "1.0.0"
description = "A language model built from first principles that writes Vietnamese verse."
readme = "README.md"
license = "MIT"
authors = [{ name = "TIENDUNG21" }]
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Natural Language :: Vietnamese",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6.100", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
lyra = "lyra.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lyra = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["slow: tests that take more than a few seconds"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "NPY", "PT", "C4", "PIE", "RET"]
ignore = ["N803", "N806", "N812", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests", "scripts"]
mypy_path = "src"
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["hypothesis.*"]
ignore_missing_imports = true
